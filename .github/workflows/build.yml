name: ZIP to ISO
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get install -y genisoimage unzip

      - name: Unzip all
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -o "$z"; done

      - name: Make ISO
        run: genisoimage -o MiniOS.iso -R -J -l./

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: MiniOS-ISO
          path: MiniOS.iso
