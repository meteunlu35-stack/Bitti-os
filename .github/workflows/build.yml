name: MiniOS ISO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Paketler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cpio unzip rsync bc wget python3 file libncurses-dev xorriso grub-pc-bin grub-efi-amd64-bin mtools

      - name: Calistirma izinleri (web'den yuklenen dosyalar izni kaybeder)
        run: chmod +x minios-os/build.sh minios-os/make-iso.sh minios-os/run.sh minios-os/run-iso.sh minios-os/overlay/etc/init.d/*

      - name: Buildroot ile derle
        working-directory: minios-os
        run: ./build.sh

      - name: ISO uret
        working-directory: minios-os
        run: ./make-iso.sh

      - name: ISO'yu yukle
        uses: actions/upload-artifact@v4
        with:
          name: MiniOS-ISO
          path: minios-os/minios.iso
