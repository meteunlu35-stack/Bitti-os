name: ZIP to ISO
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get install -y xorriso unzip

      - name: Unzip all
        run: |
          for z in *.zip; do unzip -o "$z"; done || true

      - name: Make ISO
        run: |
          xorriso -as mkisofs -o MiniOS.iso -R -J.
          ls -lh MiniOS.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: MiniOS-ISO
          path: MiniOS.iso
